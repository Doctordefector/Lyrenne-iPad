# Builds an unsigned Lyrenne.ipa on a GitHub macOS runner, which already has Xcode,
# so nobody needs a Mac or Xcode.xip. Sideloadly/AltStore sign it when installing.
# Also runs the app in an iPad simulator and uploads screenshots, to see it working.
name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install xtool
        run: brew install xtool-org/tap/xtool
      - name: Build
        run: xtool dev build --configuration release --ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Lyrenne-iPad
          path: xtool/Lyrenne.ipa

  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install xtool
        run: brew install xtool-org/tap/xtool
      # Same core on the macOS host: tells "YouTube refuses this runner's IP" apart from an iOS bug
      - name: Core check from this runner
        continue-on-error: true
        run: swift run lyrenne-check
      - name: Build for the simulator
        run: |
          xtool dev build --triple arm64-apple-ios-simulator
          codesign --force --sign - xtool/Lyrenne.app
      - name: Run on an iPad simulator
        run: |
          set -x
          ipad=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for r,ds in json.load(sys.stdin)["devices"].items() for d in ds if "iPad" in d["name"]))')
          xcrun simctl boot "$ipad"
          xcrun simctl bootstatus "$ipad"
          xcrun simctl install "$ipad" xtool/Lyrenne.app
          mkdir -p shots
          # Search, play the first result, then show Now Playing with lyrics
          SIMCTL_CHILD_LYRENNE_DEMO="Daft Punk Get Lucky" xcrun simctl launch "$ipad" com.lyrenne.ipad
          sleep 40
          xcrun simctl io "$ipad" screenshot shots/1-playing.png
          xcrun simctl spawn "$ipad" launchctl list | grep -q com.lyrenne.ipad || { echo "app is not running (crashed?)"; exit 1; }
          # YouTube refuses runner IPs ("confirm you're not a bot"), so prove playback offline:
          # a spoken test tone placed as a download, played through the same AVPlayer path
          # Two of them, to see the switch to the next song reset time, title and cover
          data="$(xcrun simctl get_app_container "$ipad" com.lyrenne.ipad data)"
          mkdir -p "$data/Documents" "$data/Library/Application Support/Downloads"
          for n in 1 2; do
            say -o /tmp/tone$n.aiff "Lyrenne test, song $n. This is the offline playback check, one two three four five."
            afconvert -f m4af -d aac /tmp/tone$n.aiff "$data/Documents/Offline check - Test tone $n [demo-tone-$n].m4a"
            echo "{\"id\":\"demo-tone-$n\",\"title\":\"Test tone $n\",\"artist\":\"Offline check\",\"duration\":\"0:06\"}" > "$data/Library/Application Support/Downloads/demo-tone-$n.json"
            sleep 1 # newest first: tone 2 lists first
          done
          xcrun simctl terminate "$ipad" com.lyrenne.ipad || true
          SIMCTL_CHILD_LYRENNE_TAB=Downloads SIMCTL_CHILD_LYRENNE_DEMO=downloads xcrun simctl launch "$ipad" com.lyrenne.ipad
          sleep 4
          xcrun simctl io "$ipad" screenshot shots/3-offline-playing.png
          sleep 8
          xcrun simctl io "$ipad" screenshot shots/4-next-song.png
          for tab in Library Queue Together; do
            xcrun simctl terminate "$ipad" com.lyrenne.ipad || true
            SIMCTL_CHILD_LYRENNE_TAB=$tab xcrun simctl launch "$ipad" com.lyrenne.ipad
            sleep 8
            xcrun simctl io "$ipad" screenshot "shots/2-$tab.png"
          done
      - name: Crash logs, if any
        if: always()
        run: ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i lyrenne && cat ~/Library/Logs/DiagnosticReports/*Lyrenne* | head -80 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: shots/
